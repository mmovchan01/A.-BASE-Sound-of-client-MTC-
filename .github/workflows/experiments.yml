name: Train and package
on:
  push:
    branches: ['arena/e6944da1-a-base-sound-of-client-mtc']
    paths: ['.github/workflows/experiments.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      OMP_NUM_THREADS: '4'
      MKL_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - run: |
          python3 -m venv .venv
          .venv/bin/pip install numpy==2.4.6
          .venv/bin/pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Experiment and train
        run: |
          mkdir -p reports/final
          .venv/bin/python scripts/final_run.py 2>&1 | tee reports/final/run.log
      - name: Save deliverables
        if: always()
        run: |
          git config user.name arena-agent
          git config user.email agent@arena.ai
          git add -f reports/final models submissions
          git diff --cached --quiet || git commit -m 'Save trained model and validation results [skip ci]'
          git push origin HEAD:arena/e6944da1-a-base-sound-of-client-mtc
