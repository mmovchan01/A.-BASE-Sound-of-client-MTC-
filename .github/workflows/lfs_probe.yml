name: lfs-probe
on:
  push:
    branches: ['arena/e6944da1-a-base-sound-of-client-mtc']
    paths: ['.github/workflows/lfs_probe.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
        continue-on-error: true
      - name: Diag
        continue-on-error: true
        run: |
          mkdir -p reports
          {
            echo "=== pwd / ls ==="
            pwd; ls -la
            echo "=== train.npz ==="
            ls -la train.npz; stat -c '%s %n' train.npz || true
            echo "=== head of train.npz ==="
            head -c 200 train.npz | od -c | head -5
            echo "=== git lfs ==="
            git lfs ls-files || true
            git lfs env || true
            echo "=== python ==="
            python3 -V; which python3
            python3 -c "import numpy; print('numpy', numpy.__version__)" || echo "NO NUMPY"
          } > reports/diag.txt 2>&1 || true
          cat reports/diag.txt
      - name: Setup python deps
        continue-on-error: true
        run: |
          python3 -m pip install --quiet --break-system-packages numpy || python3 -m pip install --quiet --user numpy || true
          python3 -c "import numpy; print('numpy ok', numpy.__version__)" >> reports/diag.txt 2>&1 || true
      - name: Stats
        continue-on-error: true
        run: |
          python3 - <<'PY' >> reports/diag.txt 2>&1
          import numpy as np, json, os
          print('size', os.path.getsize('train.npz'))
          d = np.load('train.npz')
          out = {'keys': list(d.keys())}
          X = d['embeddings']; y = d['targets']
          out['X_shape'] = list(X.shape); out['X_dtype'] = str(X.dtype)
          out['y_shape'] = list(y.shape); out['y_dtype'] = str(y.dtype)
          labels, counts = np.unique(y, return_counts=True)
          out['classes'] = {str(k): int(v) for k, v in zip(labels, counts)}
          out['nan'] = bool(np.isnan(X).any())
          out['norms_head'] = [float(v) for v in np.linalg.norm(X[:5], axis=1)]
          print('STATS:', json.dumps(out, indent=2))
          json.dump(out, open('reports/probe.json', 'w'), indent=2)
          rng = np.random.default_rng(0)
          idx = np.sort(rng.choice(len(y), size=3000, replace=False))
          np.save('reports/sample_X.npy', X[idx].astype(np.float16))
          np.save('reports/sample_y.npy', y[idx])
          PY
      - name: Commit
        if: always()
        continue-on-error: true
        run: |
          git config user.name "lfs-probe-bot"
          git config user.email "probe@example.com"
          git add -f reports
          git commit -m "probe: diagnostics [skip ci]" || echo "nothing to commit"
          git push || true
