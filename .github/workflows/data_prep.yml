name: data-prep
on:
  push:
    branches: ['arena/e6944da1-a-base-sound-of-client-mtc']
    paths: ['.github/workflows/data_prep.yml', 'scripts/prep_data.py']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: deps
        run: python3 -m pip install --quiet --break-system-packages numpy
      - name: prep
        run: python3 scripts/prep_data.py
      - name: commit
        if: always()
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@example.com"
          ls -la reports
          git add -f reports
          git commit -m "data: stats + dev subset [skip ci]" || echo "nothing to commit"
          git push || true
